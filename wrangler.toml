name = "simkl-anilist-bridge"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Poll Simkl every 10 minutes. The poll itself is a single cheap request, so
# this stays far inside the Workers free tier; drop it to "*/5 * * * *" if you
# want tighter latency between marking an episode and it landing on AniList.
[triggers]
crons = ["*/10 * * * *"]

[vars]
# Maximum AniList writes per invocation. The first run may queue hundreds of
# entries; they drain across successive cron ticks.
WRITE_BUDGET = "40"
# Minimum gap between AniList requests, in ms (~25 req/min).
ANILIST_MIN_INTERVAL_MS = "2400"
# Whether Simkl showing FEWER watched episodes should pull AniList back down.
ALLOW_LOWERING = "false"

# Created with: wrangler kv namespace create BRIDGE_STATE
# Paste the returned id below.
[[kv_namespaces]]
binding = "BRIDGE_STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets are NOT set here. Set them with:
#   wrangler secret put SIMKL_CLIENT_ID
#   wrangler secret put SIMKL_ACCESS_TOKEN
#   wrangler secret put ANILIST_ACCESS_TOKEN
#   wrangler secret put BRIDGE_TOKEN
