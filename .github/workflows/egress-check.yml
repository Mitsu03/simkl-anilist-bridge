# Throwaway probe: does AniList accept requests from GitHub's runner IPs?
#
# Cloudflare Workers turned out to be blocked at the IP level, so this answers
# the same question for GitHub Actions before anything is ported here.
# Delete this workflow once the answer is known.
name: AniList egress check

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query AniList
        env:
          ANILIST_ACCESS_TOKEN: ${{ secrets.ANILIST_ACCESS_TOKEN }}
        run: |
          node -e '
            const r = await fetch("https://graphql.anilist.co", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + process.env.ANILIST_ACCESS_TOKEN,
              },
              body: JSON.stringify({ query: "{ Viewer { id name } }" }),
            });
            const body = await r.json();
            console.log("HTTP", r.status);
            console.log(JSON.stringify(body));
            if (body.errors) {
              console.log("BLOCKED or errored:", body.errors.map(e => e.message).join("; "));
              process.exit(1);
            }
            console.log("OK — AniList answered from a GitHub runner as", body.data.Viewer.name);
          ' --input-type=module
